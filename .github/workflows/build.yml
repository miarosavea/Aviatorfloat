name: Build AviatourFloat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -type f -iname "AviatourFloat.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "AviatourFloat.zip not found"
            exit 1
          fi
          mkdir project
          unzip "$ZIP" -d project

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: project/AviatourFloat
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AviatourFloat-APK
          path: project/AviatourFloat/app/build/outputs/apk/debug/*.apk
